name: Refresh Market Data

on:
  schedule:
    # GitHub scheduled runners are best-effort and can start late. Keep two
    # attempts per target window, then use data/refresh-ledger.json to make each
    # Pacific morning/evening window idempotent even if a slot wakes up hours late.
    - cron: "17 5 * * *"
      timezone: "America/Los_Angeles"
    - cron: "47 5 * * *"
      timezone: "America/Los_Angeles"
    - cron: "17 16 * * *"
      timezone: "America/Los_Angeles"
    - cron: "47 16 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCHEDULE_TIMEZONE: America/Los_Angeles

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.failure_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest default branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Check Pacific run window
        id: pacific_time
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: node scripts/check-refresh-window.mjs

      - name: Write skipped refresh summary
        if: steps.pacific_time.outputs.run_refresh != 'true'
        run: |
          {
            echo "### Refresh skipped"
            echo ""
            echo "- Scheduled slot: \`${{ github.event.schedule || 'manual' }}\`"
            echo "- Target window: \`${{ steps.pacific_time.outputs.refresh_target_window || 'unknown' }}\`"
            echo "- Target key: \`${{ steps.pacific_time.outputs.refresh_target_key || 'unknown' }}\`"
            echo "- Reason: \`${{ steps.pacific_time.outputs.skip_reason || 'not in active refresh window' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model scoring dependencies
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: python -m pip install -r scripts/modeling/requirements.txt

      - name: Restore runtime cache
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: market-pulse-runtime-cache-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            market-pulse-runtime-cache-${{ github.ref_name }}-

      - name: Prepare runtime cache directory
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: mkdir -p data/cache

      - name: Update macro calendar
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: npm run refresh:calendar

      - name: Score tactical and long-horizon models
        id: score_models
        if: steps.pacific_time.outputs.run_refresh == 'true'
        continue-on-error: true
        timeout-minutes: 35
        env:
          MODEL_DATA_READINESS_ATTEMPTS: 3
          MODEL_DATA_READINESS_DELAY_SECONDS: 30
          MODEL_MIN_SESSION_COVERAGE: "0.90"
          MODEL_SCORING_ATTEMPTS: 2
          MODEL_SCORING_RETRY_DELAY_MS: 90000
        run: node scripts/refresh/run-model-scoring.mjs

      - name: Stop if model scoring failed
        if: steps.pacific_time.outputs.run_refresh == 'true' && steps.score_models.outcome != 'success'
        run: |
          echo "Model scoring failed; preserving the last good dashboard snapshot."
          echo "14D scorer outcome: ${{ steps.score_models.outputs.tactical_outcome || 'failure' }}"
          echo "1Y scorer outcome: ${{ steps.score_models.outputs.strategic_outcome || 'skipped' }}"
          echo "Last failed phase: ${{ steps.score_models.outputs.last_phase || 'unknown' }}"
          echo "Attempts used: ${{ steps.score_models.outputs.attempts_used || 'unknown' }}"
          exit 1

      - name: Refresh and verify snapshot
        if: steps.pacific_time.outputs.run_refresh == 'true'
        timeout-minutes: 45
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-nano
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          MODEL_SCORING_OUTCOME: ${{ steps.score_models.outputs.tactical_outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_models.outputs.strategic_outcome }}
          SNAPSHOT_REFRESH_ATTEMPTS: 2
          SNAPSHOT_REFRESH_RETRY_DELAY_MS: 5000
        run: node scripts/refresh/run-snapshot-refresh.mjs

      - name: Write successful refresh status
        if: success() && steps.pacific_time.outputs.run_refresh == 'true'
        env:
          MODEL_SCORING_OUTCOME: ${{ steps.score_models.outputs.tactical_outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_models.outputs.strategic_outcome }}
          PAGES_PUBLISH_STATUS: published
        run: node scripts/write-refresh-status.mjs success "Refresh completed, passed verification, and was packaged for GitHub Pages publication. Check modelStatus and marketDataStatus for freshness guardrails."

      - name: Check remote branch before publish
        id: publish_guard
        if: success() && steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote branch advanced during this refresh; skipping commit and Pages deploy to avoid overwriting newer output."
            echo "remote_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "remote_changed=false" >> "$GITHUB_OUTPUT"

      - name: Save runtime cache
        if: always() && steps.pacific_time.outputs.run_refresh == 'true' && steps.score_models.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: market-pulse-runtime-cache-${{ github.ref_name }}-${{ github.run_id }}

      - name: Prepare static site
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true'
        run: |
          mkdir -p public/data public/config public/src
          cp index.html styles.css app.js public/
          cp -R src/. public/src/
          cp data/snapshot.json public/data/snapshot.json
          cp data/model-scorebook.json public/data/model-scorebook.json
          cp data/model-monitoring.json public/data/model-monitoring.json
          if [ -f data/long-horizon-research.json ]; then
            cp data/long-horizon-research.json public/data/long-horizon-research.json
          fi
          cp data/macro-calendar.json public/data/macro-calendar.json
          cp data/refresh-status.json public/data/refresh-status.json
          cp data/refresh-ledger.json public/data/refresh-ledger.json
          cp config/runtime.json public/config/runtime.json

      - name: Configure Pages
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Pause before deploy retry
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && steps.deployment.outcome != 'success'
        run: sleep 30

      - name: Retry Deploy Pages
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && steps.deployment.outcome != 'success'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      - name: Stop if Pages deploy failed
        if: steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        run: |
          echo "GitHub Pages deployment failed after retry."
          exit 1

      - name: Probe live Pages status
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        id: live_pages
        timeout-minutes: 15
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          LIVE_CONFIRM_ATTEMPTS: 12
          LIVE_CONFIRM_DELAY_MS: 10000
          LIVE_CONFIRM_STRICT: "1"
        run: node scripts/refresh/confirm-live-pages.mjs

      - name: Record confirmed publish in refresh ledger
        if: success() && steps.live_pages.outputs.live_confirmed == 'true' && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        env:
          MODEL_SCORING_OUTCOME: ${{ steps.score_models.outputs.tactical_outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_models.outputs.strategic_outcome }}
          PAGES_PUBLISH_STATUS: published
          UPDATE_REFRESH_LEDGER: "1"
        run: node scripts/write-refresh-status.mjs success "Refresh completed, passed verification, and was confirmed live on GitHub Pages."

      - name: Commit published refresh outputs
        id: commit_success_outputs
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.publish_guard.outputs.remote_changed != 'true' && (steps.deployment.outcome == 'success' || steps.deployment_retry.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote branch advanced after Pages deploy; skipping commit to avoid overwriting newer output."
            echo "remote_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "remote_changed=false" >> "$GITHUB_OUTPUT"
          git add data/snapshot.json data/model-scorebook.json data/model-monitoring.json data/long-horizon-research.json data/refresh-status.json data/refresh-ledger.json data/macro-calendar.json
          if git diff --cached --quiet; then
            echo "No refresh output changes to commit."
          else
            git commit -m "Refresh market snapshot"
            git push
          fi

      - name: Restore last verified dashboard artifacts after failure
        id: failure_recovery
        if: failure() && steps.pacific_time.outputs.run_refresh == 'true'
        env:
          LIVE_PAGES_CONFIRMED: ${{ steps.live_pages.outputs.live_confirmed }}
        run: node scripts/refresh/recover-dashboard.mjs

      - name: Write failed refresh status
        if: failure() && steps.failure_recovery.outputs.recovered == 'true'
        env:
          MODEL_SCORING_OUTCOME: ${{ steps.score_models.outputs.tactical_outcome || 'failure' }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_models.outputs.strategic_outcome || 'skipped' }}
          PAGES_PUBLISH_STATUS: not_published
        run: node scripts/write-refresh-status.mjs failure "Refresh or live publication confirmation failed; retained the checked-in snapshot. Inspect the linked GitHub Actions run."

      - name: Prepare last-good site with failure status
        if: failure() && steps.failure_recovery.outputs.recovered == 'true' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        run: |
          mkdir -p public/data public/config public/src
          cp index.html styles.css app.js public/
          cp -R src/. public/src/
          cp data/snapshot.json public/data/snapshot.json
          cp data/model-scorebook.json public/data/model-scorebook.json
          cp data/model-monitoring.json public/data/model-monitoring.json
          cp data/long-horizon-research.json public/data/long-horizon-research.json
          cp data/macro-calendar.json public/data/macro-calendar.json
          cp data/refresh-status.json public/data/refresh-status.json
          cp data/refresh-ledger.json public/data/refresh-ledger.json
          cp config/runtime.json public/config/runtime.json

      - name: Configure Pages for failure status
        if: failure() && steps.failure_recovery.outputs.recovered == 'true' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        uses: actions/configure-pages@v5

      - name: Upload failure-status Pages artifact
        if: failure() && steps.failure_recovery.outputs.recovered == 'true' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-failure
          path: public

      - name: Publish failure status to Pages
        if: failure() && steps.failure_recovery.outputs.recovered == 'true' && steps.deployment.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        id: failure_deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-failure

      - name: Commit failed refresh status
        id: commit_failure_status
        if: failure() && steps.failure_recovery.outputs.recovered == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote branch advanced during this failed refresh; skipping failure-status commit."
            echo "remote_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "remote_changed=false" >> "$GITHUB_OUTPUT"
          git add data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No failure status changes to commit."
          else
            git commit -m "Record failed refresh status"
            git push
          fi
