name: Refresh Market Data

on:
  schedule:
    # GitHub cron runs in UTC and can be delayed after the scheduled slot.
    # These slots cover the intended 5 AM and 4 PM Pacific refreshes, plus the
    # following Pacific hour as a backstop, across daylight saving and standard
    # time. GitHub's scheduled runners are best-effort, so backup slots reduce
    # the chance that a delayed or dropped cron slot leaves the site stale. The
    # gate below refreshes only once per Pacific morning/evening window.
    # The gate below evaluates the intended scheduled slot, not the delayed
    # runner start time, so late GitHub scheduling does not skip the refresh.
    - cron: "11 12 * * *"
    - cron: "41 12 * * *"
    - cron: "11 13 * * *"
    - cron: "41 13 * * *"
    - cron: "11 14 * * *"
    - cron: "41 14 * * *"
    - cron: "11 23 * * *"
    - cron: "41 23 * * *"
    - cron: "11 0 * * *"
    - cron: "41 0 * * *"
    - cron: "11 1 * * *"
    - cron: "41 1 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest default branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Check Pacific run window
        id: pacific_time
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "scheduled_utc=manual" >> "$GITHUB_OUTPUT"
            echo "scheduled_pacific=manual" >> "$GITHUB_OUTPUT"
            echo "actual_start_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
            echo "schedule_delay_minutes=0" >> "$GITHUB_OUTPUT"
            echo "refresh_target_key=manual" >> "$GITHUB_OUTPUT"
            echo "refresh_target_window=manual" >> "$GITHUB_OUTPUT"
            {
              echo "SCHEDULED_UTC=manual"
              echo "SCHEDULED_PACIFIC=manual"
              echo "ACTUAL_START_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "SCHEDULE_DELAY_MINUTES=0"
              echo "REFRESH_TARGET_KEY=manual"
              echo "REFRESH_TARGET_WINDOW=manual"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          set -- $SCHEDULE
          scheduled_minute="$1"
          scheduled_hour="$2"
          if ! [[ "$scheduled_minute" =~ ^[0-9]+$ && "$scheduled_hour" =~ ^[0-9]+$ ]]; then
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "skip_reason=unknown schedule slot: $SCHEDULE" >> "$GITHUB_OUTPUT"
            echo "Unknown schedule slot: $SCHEDULE"
            exit 0
          fi

          python3 - "$scheduled_hour" "$scheduled_minute" > /tmp/pacific-window.env <<'PY'
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path
          import sys

          scheduled_hour = int(sys.argv[1])
          scheduled_minute = int(sys.argv[2])
          actual_utc = datetime.now(timezone.utc)
          today = actual_utc.date()
          scheduled_utc = datetime(
              today.year,
              today.month,
              today.day,
              scheduled_hour,
              scheduled_minute,
              tzinfo=timezone.utc,
          )
          if scheduled_utc - actual_utc > timedelta(hours=1):
              scheduled_utc -= timedelta(days=1)
          scheduled_pacific = scheduled_utc.astimezone(ZoneInfo("America/Los_Angeles"))
          delay_minutes = round((actual_utc - scheduled_utc).total_seconds() / 60)
          if 5 <= scheduled_pacific.hour <= 6:
              target_window = "morning"
          elif 16 <= scheduled_pacific.hour <= 17:
              target_window = "evening"
          else:
              target_window = "off_window"

          target_key = (
              f"{scheduled_pacific.date().isoformat()}-{target_window}"
              if target_window != "off_window"
              else None
          )

          prior = {}
          try:
              prior = json.loads(Path("data/refresh-status.json").read_text())
          except Exception:
              prior = {}

          already_refreshed = (
              target_key
              and prior.get("status") == "success"
              and prior.get("refreshTargetKey") == target_key
          )
          should_run = target_window in {"morning", "evening"} and not already_refreshed
          if target_window == "off_window":
              skip_reason = "scheduled slot is outside the Pacific refresh backstop windows"
          elif already_refreshed:
              skip_reason = f"{target_window} refresh already succeeded for {scheduled_pacific.date().isoformat()}"
          else:
              skip_reason = ""

          print(f"scheduled_utc={scheduled_utc.isoformat()}")
          print(f"scheduled_pacific={scheduled_pacific.isoformat()}")
          print(f"actual_start_utc={actual_utc.isoformat()}")
          print(f"schedule_delay_minutes={delay_minutes}")
          print(f"refresh_target_key={target_key or ''}")
          print(f"refresh_target_window={target_window}")
          print(f"skip_reason={skip_reason}")
          print(f"run_refresh={'true' if should_run else 'false'}")
          PY

          cat /tmp/pacific-window.env
          cat /tmp/pacific-window.env >> "$GITHUB_OUTPUT"
          {
            grep '^scheduled_utc=' /tmp/pacific-window.env | sed 's/^scheduled_utc=/SCHEDULED_UTC=/'
            grep '^scheduled_pacific=' /tmp/pacific-window.env | sed 's/^scheduled_pacific=/SCHEDULED_PACIFIC=/'
            grep '^actual_start_utc=' /tmp/pacific-window.env | sed 's/^actual_start_utc=/ACTUAL_START_UTC=/'
            grep '^schedule_delay_minutes=' /tmp/pacific-window.env | sed 's/^schedule_delay_minutes=/SCHEDULE_DELAY_MINUTES=/'
            grep '^refresh_target_key=' /tmp/pacific-window.env | sed 's/^refresh_target_key=/REFRESH_TARGET_KEY=/'
            grep '^refresh_target_window=' /tmp/pacific-window.env | sed 's/^refresh_target_window=/REFRESH_TARGET_WINDOW=/'
            grep '^skip_reason=' /tmp/pacific-window.env | sed 's/^skip_reason=/REFRESH_SKIP_REASON=/'
          } >> "$GITHUB_ENV"

          if ! grep -q '^run_refresh=true$' /tmp/pacific-window.env; then
            echo "Skipping refresh: $(grep '^skip_reason=' /tmp/pacific-window.env | cut -d= -f2-)"
          fi

      - name: Write skipped refresh summary
        if: steps.pacific_time.outputs.run_refresh != 'true'
        run: |
          {
            echo "### Refresh skipped"
            echo ""
            echo "- Scheduled slot: \`${{ github.event.schedule || 'manual' }}\`"
            echo "- Target window: \`${{ steps.pacific_time.outputs.refresh_target_window || 'unknown' }}\`"
            echo "- Target key: \`${{ steps.pacific_time.outputs.refresh_target_key || 'unknown' }}\`"
            echo "- Reason: \`${{ steps.pacific_time.outputs.skip_reason || 'not in active refresh window' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model scoring dependencies
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: python -m pip install -r scripts/modeling/requirements.txt

      - name: Update macro calendar
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: npm run refresh:calendar

      - name: Score XGBoost rank model
        id: score_model
        if: steps.pacific_time.outputs.run_refresh == 'true'
        continue-on-error: true
        run: python scripts/modeling/score_live_rank_model.py --output data/model-rank-scores.json --max-workers 4

      - name: Score long-horizon rank model
        id: score_long_horizon_model
        if: steps.pacific_time.outputs.run_refresh == 'true'
        continue-on-error: true
        run: >
          python scripts/modeling/score_live_rank_model.py
          --model-dir models/long-horizon
          --model-name xgboost_rank_sector252_15y_monthly_tuned_research
          --output data/model-rank-scores-long-horizon.json
          --reference-cache data/model-reference-cache.json
          --score-reference-cache

      - name: Stop if model scoring failed
        if: steps.pacific_time.outputs.run_refresh == 'true' && (steps.score_model.outcome != 'success' || steps.score_long_horizon_model.outcome != 'success')
        run: |
          echo "Model scoring failed; preserving the last good dashboard snapshot."
          echo "14D scorer outcome: ${{ steps.score_model.outcome }}"
          echo "1Y scorer outcome: ${{ steps.score_long_horizon_model.outcome }}"
          exit 1

      - name: Refresh snapshot
        if: steps.pacific_time.outputs.run_refresh == 'true'
        timeout-minutes: 25
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-nano
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          MODEL_SCORING_OUTCOME: ${{ steps.score_model.outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_long_horizon_model.outcome }}
        run: node scripts/update-data.mjs

      - name: Verify generated site data
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: npm run verify

      - name: Write successful refresh status
        if: success() && steps.pacific_time.outputs.run_refresh == 'true'
        env:
          MODEL_SCORING_OUTCOME: ${{ steps.score_model.outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_long_horizon_model.outcome }}
        run: node scripts/write-refresh-status.mjs success "Refresh completed and generated dashboard artifacts. Check modelStatus and marketDataStatus for freshness guardrails."

      - name: Write failed refresh status
        if: failure() && steps.pacific_time.outputs.run_refresh == 'true'
        env:
          MODEL_SCORING_OUTCOME: ${{ steps.score_model.outcome }}
          LONG_HORIZON_SCORING_OUTCOME: ${{ steps.score_long_horizon_model.outcome }}
        run: node scripts/write-refresh-status.mjs failure "Refresh workflow failed before completion; inspect the linked GitHub Actions run."

      - name: Commit successful refresh outputs
        id: commit_success_outputs
        if: success() && steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote branch advanced during this refresh; skipping commit and Pages deploy to avoid overwriting newer output."
            echo "remote_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "remote_changed=false" >> "$GITHUB_OUTPUT"
          git add data/snapshot.json data/model-scorebook.json data/model-monitoring.json data/long-horizon-research.json data/model-reference-cache.json data/market-cap-cache.json data/deeper-read-history.json data/reddit-tape-cache.json data/refresh-status.json data/macro-calendar.json
          if git diff --cached --quiet; then
            echo "No refresh output changes to commit."
          else
            git commit -m "Refresh market snapshot"
            git push
          fi

      - name: Commit failed refresh status
        id: commit_failure_status
        if: failure() && steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          remote_sha="$(git rev-parse "origin/$GITHUB_REF_NAME")"
          local_sha="$(git rev-parse HEAD)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "Remote branch advanced during this failed refresh; skipping failure-status commit."
            echo "remote_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "remote_changed=false" >> "$GITHUB_OUTPUT"
          git add data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No failure status changes to commit."
          else
            git commit -m "Record failed refresh status"
            git push
          fi

      - name: Prepare static site
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.commit_success_outputs.outputs.remote_changed != 'true'
        run: |
          mkdir -p public/data public/config
          cp index.html styles.css app.js public/
          cp data/snapshot.json public/data/snapshot.json
          cp data/model-scorebook.json public/data/model-scorebook.json
          cp data/model-monitoring.json public/data/model-monitoring.json
          if [ -f data/long-horizon-research.json ]; then
            cp data/long-horizon-research.json public/data/long-horizon-research.json
          fi
          cp data/macro-calendar.json public/data/macro-calendar.json
          cp data/refresh-status.json public/data/refresh-status.json
          cp config/runtime.json public/config/runtime.json

      - name: Configure Pages
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.commit_success_outputs.outputs.remote_changed != 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.commit_success_outputs.outputs.remote_changed != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        if: success() && steps.pacific_time.outputs.run_refresh == 'true' && steps.commit_success_outputs.outputs.remote_changed != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
