name: Refresh Market Data

on:
  schedule:
    # GitHub cron runs in UTC. These two daily checks cover 5 PM Pacific
    # across daylight saving time; the workflow skips the non-5 PM run below.
    - cron: "0 0,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Pacific run window
        id: pacific_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          if [ "$pacific_hour" = "17" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_refresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping refresh because it is not 5 PM Pacific."
          fi

      - name: Set up Node
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh snapshot
        if: steps.pacific_time.outputs.run_refresh == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-nano
        run: node scripts/update-data.mjs

      - name: Commit updated snapshot
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Refresh market snapshot"
            git push
          fi
