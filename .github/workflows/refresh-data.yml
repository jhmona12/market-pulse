name: Refresh Market Data

on:
  schedule:
    # GitHub cron runs in UTC and can be delayed after the scheduled slot.
    # These slots cover 7:11/7:31/7:51 AM and 5:11/5:31/5:51 PM Pacific
    # across daylight saving time. Multiple attempts reduce the impact of
    # GitHub's best-effort scheduled runner. The gate below refreshes only
    # once per Pacific morning/evening window.
    # The gate below evaluates the intended scheduled slot, not the delayed
    # runner start time, so late GitHub scheduling does not skip the refresh.
    - cron: "11 14 * * *"
    - cron: "31 14 * * *"
    - cron: "51 14 * * *"
    - cron: "11 15 * * *"
    - cron: "31 15 * * *"
    - cron: "51 15 * * *"
    - cron: "11 0 * * *"
    - cron: "31 0 * * *"
    - cron: "51 0 * * *"
    - cron: "11 1 * * *"
    - cron: "31 1 * * *"
    - cron: "51 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest default branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Check Pacific run window
        id: pacific_time
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_refresh=true" >> "$GITHUB_OUTPUT"
            echo "scheduled_utc=manual" >> "$GITHUB_OUTPUT"
            echo "scheduled_pacific=manual" >> "$GITHUB_OUTPUT"
            echo "actual_start_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
            echo "schedule_delay_minutes=0" >> "$GITHUB_OUTPUT"
            echo "refresh_target_key=manual" >> "$GITHUB_OUTPUT"
            echo "refresh_target_window=manual" >> "$GITHUB_OUTPUT"
            {
              echo "SCHEDULED_UTC=manual"
              echo "SCHEDULED_PACIFIC=manual"
              echo "ACTUAL_START_UTC=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              echo "SCHEDULE_DELAY_MINUTES=0"
              echo "REFRESH_TARGET_KEY=manual"
              echo "REFRESH_TARGET_WINDOW=manual"
            } >> "$GITHUB_ENV"
            exit 0
          fi

          case "$SCHEDULE" in
            "11 14 * * *")
              scheduled_hour=14
              scheduled_minute=11
              ;;
            "31 14 * * *")
              scheduled_hour=14
              scheduled_minute=31
              ;;
            "51 14 * * *")
              scheduled_hour=14
              scheduled_minute=51
              ;;
            "11 15 * * *")
              scheduled_hour=15
              scheduled_minute=11
              ;;
            "31 15 * * *")
              scheduled_hour=15
              scheduled_minute=31
              ;;
            "51 15 * * *")
              scheduled_hour=15
              scheduled_minute=51
              ;;
            "11 0 * * *")
              scheduled_hour=0
              scheduled_minute=11
              ;;
            "31 0 * * *")
              scheduled_hour=0
              scheduled_minute=31
              ;;
            "51 0 * * *")
              scheduled_hour=0
              scheduled_minute=51
              ;;
            "11 1 * * *")
              scheduled_hour=1
              scheduled_minute=11
              ;;
            "31 1 * * *")
              scheduled_hour=1
              scheduled_minute=31
              ;;
            "51 1 * * *")
              scheduled_hour=1
              scheduled_minute=51
              ;;
            *)
              echo "run_refresh=false" >> "$GITHUB_OUTPUT"
              echo "Unknown schedule slot: $SCHEDULE"
              exit 0
              ;;
          esac

          python3 - "$scheduled_hour" "$scheduled_minute" > /tmp/pacific-window.env <<'PY'
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo
          import json
          from pathlib import Path
          import sys

          scheduled_hour = int(sys.argv[1])
          scheduled_minute = int(sys.argv[2])
          actual_utc = datetime.now(timezone.utc)
          today = actual_utc.date()
          scheduled_utc = datetime(
              today.year,
              today.month,
              today.day,
              scheduled_hour,
              scheduled_minute,
              tzinfo=timezone.utc,
          )
          scheduled_pacific = scheduled_utc.astimezone(ZoneInfo("America/Los_Angeles"))
          delay_minutes = round((actual_utc - scheduled_utc).total_seconds() / 60)
          if scheduled_pacific.hour == 7:
              target_window = "morning"
          elif scheduled_pacific.hour == 17:
              target_window = "evening"
          else:
              target_window = "off_window"

          target_key = (
              f"{scheduled_pacific.date().isoformat()}-{target_window}"
              if target_window != "off_window"
              else None
          )

          prior = {}
          try:
              prior = json.loads(Path("data/refresh-status.json").read_text())
          except Exception:
              prior = {}

          already_refreshed = (
              target_key
              and prior.get("status") == "success"
              and prior.get("refreshTargetKey") == target_key
          )
          should_run = target_window in {"morning", "evening"} and not already_refreshed
          if target_window == "off_window":
              skip_reason = "scheduled slot is not 7 AM or 5 PM Pacific"
          elif already_refreshed:
              skip_reason = f"{target_window} refresh already succeeded for {scheduled_pacific.date().isoformat()}"
          else:
              skip_reason = ""

          print(f"scheduled_utc={scheduled_utc.isoformat()}")
          print(f"scheduled_pacific={scheduled_pacific.isoformat()}")
          print(f"actual_start_utc={actual_utc.isoformat()}")
          print(f"schedule_delay_minutes={delay_minutes}")
          print(f"refresh_target_key={target_key or ''}")
          print(f"refresh_target_window={target_window}")
          print(f"skip_reason={skip_reason}")
          print(f"run_refresh={'true' if should_run else 'false'}")
          PY

          cat /tmp/pacific-window.env
          cat /tmp/pacific-window.env >> "$GITHUB_OUTPUT"
          {
            grep '^scheduled_utc=' /tmp/pacific-window.env | sed 's/^scheduled_utc=/SCHEDULED_UTC=/'
            grep '^scheduled_pacific=' /tmp/pacific-window.env | sed 's/^scheduled_pacific=/SCHEDULED_PACIFIC=/'
            grep '^actual_start_utc=' /tmp/pacific-window.env | sed 's/^actual_start_utc=/ACTUAL_START_UTC=/'
            grep '^schedule_delay_minutes=' /tmp/pacific-window.env | sed 's/^schedule_delay_minutes=/SCHEDULE_DELAY_MINUTES=/'
            grep '^refresh_target_key=' /tmp/pacific-window.env | sed 's/^refresh_target_key=/REFRESH_TARGET_KEY=/'
            grep '^refresh_target_window=' /tmp/pacific-window.env | sed 's/^refresh_target_window=/REFRESH_TARGET_WINDOW=/'
            grep '^skip_reason=' /tmp/pacific-window.env | sed 's/^skip_reason=/REFRESH_SKIP_REASON=/'
          } >> "$GITHUB_ENV"

          if ! grep -q '^run_refresh=true$' /tmp/pacific-window.env; then
            echo "Skipping refresh: $(grep '^skip_reason=' /tmp/pacific-window.env | cut -d= -f2-)"
          fi

      - name: Set up Node
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        if: steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model scoring dependencies
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: python -m pip install -r scripts/modeling/requirements.txt

      - name: Score XGBoost rank model
        if: steps.pacific_time.outputs.run_refresh == 'true'
        run: python scripts/modeling/score_live_rank_model.py --output data/model-rank-scores.json

      - name: Refresh snapshot
        if: steps.pacific_time.outputs.run_refresh == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-nano
        run: node scripts/update-data.mjs

      - name: Write successful refresh status
        if: success() && steps.pacific_time.outputs.run_refresh == 'true'
        run: node scripts/write-refresh-status.mjs success "Refresh completed and generated dashboard artifacts."

      - name: Write failed refresh status
        if: failure() && steps.pacific_time.outputs.run_refresh == 'true'
        run: node scripts/write-refresh-status.mjs failure "Refresh workflow failed before completion; inspect the linked GitHub Actions run."

      - name: Commit refresh outputs
        if: always() && steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json data/model-scorebook.json data/model-reference-cache.json data/market-cap-cache.json data/refresh-status.json
          if git diff --cached --quiet; then
            echo "No refresh output changes to commit."
          else
            git commit -m "Refresh market snapshot"
            git push
          fi

      - name: Prepare static site
        if: always() && steps.pacific_time.outputs.run_refresh == 'true'
        run: |
          mkdir -p public/data public/config
          cp index.html styles.css app.js public/
          cp data/snapshot.json public/data/snapshot.json
          cp data/model-scorebook.json public/data/model-scorebook.json
          cp data/refresh-status.json public/data/refresh-status.json
          cp config/runtime.json public/config/runtime.json

      - name: Configure Pages
        if: always() && steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && steps.pacific_time.outputs.run_refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        if: always() && steps.pacific_time.outputs.run_refresh == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
