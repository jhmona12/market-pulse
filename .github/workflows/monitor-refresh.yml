name: Monitor Refresh Health

on:
  schedule:
    - cron: "30 9 * * *"
      timezone: "America/Los_Angeles"
    - cron: "30 20 * * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCHEDULE_TIMEZONE: America/Los_Angeles
  LIVE_DASHBOARD_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync latest default branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check for missed refresh targets
        run: node scripts/monitor-refreshes.mjs
