name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify project
        run: npm run verify

      - name: Prepare static site
        run: |
          mkdir -p public/data public/config
          cp index.html styles.css app.js public/
          cp -R src public/src
          cp data/snapshot.json public/data/snapshot.json
          cp data/model-scorebook.json public/data/model-scorebook.json
          cp data/model-monitoring.json public/data/model-monitoring.json
          if [ -f data/long-horizon-research.json ]; then
            cp data/long-horizon-research.json public/data/long-horizon-research.json
          fi
          if [ -f data/macro-calendar.json ]; then
            cp data/macro-calendar.json public/data/macro-calendar.json
          fi
          if [ -f data/refresh-status.json ]; then
            cp data/refresh-status.json public/data/refresh-status.json
          fi
          if [ -f data/refresh-ledger.json ]; then
            cp data/refresh-ledger.json public/data/refresh-ledger.json
          fi
          cp config/runtime.json public/config/runtime.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
